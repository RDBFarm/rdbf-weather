name: RDBF Forecast Logger

on:
  schedule:
    # Once a morning, with a second chance in the evening. GitHub delays and
    # sometimes drops scheduled runs (see weather.yml for the measurements), so
    # the evening run exists only so a dropped morning run still leaves a row.
    # If the morning run succeeded, the evening run saves nothing new: the first
    # forecast saved each day is the one that counts.
    - cron: "10 10 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # "Run workflow" button for testing

# Share weather.yml's queue so the two never write at the same moment.
concurrency:
  group: weather-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log-forecasts:
    # Same named image and Python as weather.yml, for the same reason.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Save today's forecasts
        run: python forecast_log.py

      # NOAA's ensemble, for scoring its spread (ensemble_log.py says why).
      # It never fails the job: a missing ensemble must not cost the rows above.
      - name: Save today's ensemble forecast
        run: python ensemble_log.py

      - name: Update the scorecard
        run: python score_forecasts.py

      - name: Post run summary
        if: always()
        run: |
          if [ -f forecast_scores.md ]; then
            cat forecast_scores.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit forecast files
        run: |
          git config user.name "rdbf-bot"
          git config user.email "actions@users.noreply.github.com"

          # forecast_log.csv is a ledger (never lose a row); the two score files
          # are rebuilt from it every run. On a rejected push we sync to the
          # remote and re-run, same approach as weather.yml: the logger skips
          # rows already present, so nothing is lost or duplicated.
          for attempt in 1 2 3 4 5; do
            # The ensemble ledger only once it exists: a first run that got no
            # ensemble must still commit the forecasts.
            git add forecast_log.csv forecast_scores.csv forecast_scores.md $(ls ensemble_log.csv 2>/dev/null)
            if git diff --cached --quiet; then
              echo "No forecast changes to commit."
              exit 0
            fi
            git commit -m "Forecast log $(TZ=America/New_York date +'%Y-%m-%d %-I:%M %p %Z')"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected — syncing to remote, then regenerating (attempt $attempt)."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            python forecast_log.py
            python ensemble_log.py
            python score_forecasts.py
            sleep 2
          done

          echo "Push still failing after 5 attempts."
          exit 1
